# Builds the debug APK on GitHub's servers. Untested template: it was written without being able to run it.
# Use: push this project to a GitHub repo (project root = repo root) > Actions tab > "Build debug APK" > Run workflow
# > download the "jinwoo-debug-apk" artifact (a zip containing app-debug.apk).
name: Build debug APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests (non-blocking)
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jinwoo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
